name: Site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/screenshots/**'
      - 'docs/store-listing/play-icon.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      # The viewer fetches tiles from the browser, so this key is readable by anyone who opens the
      # page; it is a key of its own, locked to the site's origin at Protomaps, and never the one
      # the app is built with. The build bakes it into the viewer's script.
      - name: Build the site
        env:
          PUBLIC_PROTOMAPS_KEY: ${{ secrets.PROTOMAPS_WEB_KEY }}
        run: |
          [ -n "$PUBLIC_PROTOMAPS_KEY" ] || { echo "PROTOMAPS_WEB_KEY secret is not set" >&2; exit 1; }
          npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
