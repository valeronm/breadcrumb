name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release-bundle:
    runs-on: ubuntu-latest
    steps:
      # Every tag, not just this one: the versionCode check below reads the build file at each of
      # them, and the default shallow checkout carries no tags at all.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The tag is the version, so git itself refuses a second upload of one — which is what makes
      # "every upload bumps the version" a rule that cannot be broken by forgetting it. The version
      # carries to the release step below rather than being parsed back out of the tag.
      - name: Check the tag matches the build file
        run: |
          build_version="$(sed -n 's/^ *versionName = "\([0-9.]*\)"$/\1/p' app/build.gradle.kts)"
          if [ "$GITHUB_REF_NAME" != "v$build_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match app/build.gradle.kts, which would tag v$build_version" >&2
            exit 1
          fi
          echo "VERSION_NAME=$build_version" >> "$GITHUB_ENV"

      # The versionCode is the one release value nothing else here reads — not the tag, not the UI,
      # not the logs — so a bump forgotten beside the version would surface only as Play rejecting
      # the upload. Measured against every previous tag rather than the newest, since tags of two
      # naming schemes sort together unreliably and the rule is only that it must exceed them all.
      - name: Check the versionCode increases
        run: |
          version_code() { sed -n 's/^ *versionCode = \([0-9]*\)$/\1/p'; }
          build_vc="$(version_code < app/build.gradle.kts)"
          highest=0
          others=0
          for tag in $(git tag); do
            [ "$tag" = "$GITHUB_REF_NAME" ] && continue
            others=$((others + 1))
            vc="$(git show "$tag:app/build.gradle.kts" 2>/dev/null | version_code)"
            [ "${vc:-0}" -gt "$highest" ] && highest="$vc"
          done
          # This reads a file's syntax at tags nobody can ever rewrite, so it must say when it has
          # stopped reading anything at all. Moving the value to another file, or a comment landing
          # on that line, would otherwise leave every tag unparsed, the bar at zero, and this step
          # waving through whatever it was handed — a guard degraded to a no-op, and still believed.
          if [ "$others" -gt 0 ] && [ "$highest" -eq 0 ]; then
            echo "Read no versionCode at any of the $others previous tags — this guard has stopped parsing the build file" >&2
            exit 1
          fi
          if [ "$build_vc" -le "$highest" ]; then
            echo "versionCode $build_vc must exceed $highest, the highest already tagged" >&2
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Materialize signing config
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          PROTOMAPS_API_KEY: ${{ secrets.PROTOMAPS_API_KEY }}
        run: |
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cat > keystore.properties <<EOF
          uploadStoreFile=$RUNNER_TEMP/upload.jks
          uploadKeyAlias=$UPLOAD_KEY_ALIAS
          uploadStorePassword=$UPLOAD_STORE_PASSWORD
          EOF
          echo "protomapsApiKey=$PROTOMAPS_API_KEY" > local.properties

      - name: Build release bundle
        run: ./gradlew :app:bundleRelease

      - name: Create GitHub release with the bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bundle="breadcrumb-$GITHUB_REF_NAME.aab"
          cp app/build/outputs/bundle/release/app-release.aab "$bundle"
          gh release create "$GITHUB_REF_NAME" \
            "$bundle" \
            --title "$GITHUB_REF_NAME" \
            --notes "Play upload bundle, versionName $VERSION_NAME, built from $GITHUB_SHA."
