name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The tag is the version, so git itself refuses a second upload of one — which is what makes
      # "every upload bumps the version" a rule that cannot be broken by forgetting it. The version
      # carries to the release step below rather than being parsed back out of the tag.
      - name: Check the tag matches the build file
        run: |
          build_version="$(sed -n 's/^ *versionName = "\([0-9.]*\)"$/\1/p' app/build.gradle.kts)"
          if [ "$GITHUB_REF_NAME" != "v$build_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match app/build.gradle.kts, which would tag v$build_version" >&2
            exit 1
          fi
          echo "VERSION_NAME=$build_version" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Materialize signing config
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          PROTOMAPS_API_KEY: ${{ secrets.PROTOMAPS_API_KEY }}
        run: |
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cat > keystore.properties <<EOF
          uploadStoreFile=$RUNNER_TEMP/upload.jks
          uploadKeyAlias=$UPLOAD_KEY_ALIAS
          uploadStorePassword=$UPLOAD_STORE_PASSWORD
          EOF
          echo "protomapsApiKey=$PROTOMAPS_API_KEY" > local.properties

      - name: Build release bundle
        run: ./gradlew :app:bundleRelease

      - name: Create GitHub release with the bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bundle="breadcrumb-$GITHUB_REF_NAME.aab"
          cp app/build/outputs/bundle/release/app-release.aab "$bundle"
          gh release create "$GITHUB_REF_NAME" \
            "$bundle" \
            --title "$GITHUB_REF_NAME" \
            --notes "Play upload bundle, versionName $VERSION_NAME, built from $GITHUB_SHA."
