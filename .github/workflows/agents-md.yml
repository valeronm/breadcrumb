name: AGENTS.md

on:
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - '.github/workflows/agents-md.yml'
  pull_request:
    paths:
      - 'AGENTS.md'
      - '.github/workflows/agents-md.yml'

permissions:
  contents: read

jobs:
  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Codex reads only the first 32 KiB of project instructions (its project_doc_max_bytes).
      - name: Check AGENTS.md fits what Codex reads
        run: |
          max=32768
          size=$(wc -c < AGENTS.md)
          echo "AGENTS.md is $size of $max bytes"
          test "$size" -le "$max"
