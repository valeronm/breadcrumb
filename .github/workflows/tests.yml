name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'tools/**'
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.worktreeinclude'
      - 'site/**'
      - '.github/workflows/release.yml'
      - '.github/workflows/pages.yml'
      - '.github/workflows/dependency-graph.yml'
      - '.github/workflows/codeql.yml'
      - '.github/workflows/agents-md.yml'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'tools/**'
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.worktreeinclude'
      - 'site/**'
      - '.github/workflows/release.yml'
      - '.github/workflows/pages.yml'
      - '.github/workflows/dependency-graph.yml'
      - '.github/workflows/codeql.yml'
      - '.github/workflows/agents-md.yml'

permissions:
  contents: read

# Only a pull request's runs share a group; every other run gets its own and is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: gradle/actions/setup-gradle@v6

      - name: Install the compile SDK platform
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-37.1"

      - name: Check code style
        run: ./gradlew :app:ktlintCheck

      - name: Run detekt
        run: ./gradlew :app:detekt

      - name: Run Android Lint
        run: ./gradlew :app:lintDebug

      # Compiling rewrites app/schemas from the entities, and intent-to-add puts an uncommitted
      # new version's file into the diff, which otherwise skips it as untracked.
      - name: Check the committed Room schemas match the entities
        run: |
          git add --intent-to-add -- app/schemas
          git diff --exit-code -- app/schemas

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
