name: Dependency graph

# Submits the dependency graph GitHub matches against security advisories.
#
# Only the app's release runtime classpath is recorded — what actually ships in
# the APK. Left unfiltered, the graph also picks up the Gradle plugin classpath
# (AGP drags in bouncycastle, netty, jose4j, jdom2 …), and every advisory
# against those becomes an alert about code that never leaves the build machine
# and that no change in this repo could fix.

on:
  push:
    branches: [main]
    paths:
      - '**.gradle.kts'
      - 'gradle/wrapper/**'
      - 'gradle.properties'
      - '.github/workflows/dependency-graph.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/dependency-submission@v6
        with:
          dependency-graph-include-projects: ':app'
          dependency-graph-include-configurations: 'releaseRuntimeClasspath'
